name: Release & Deploy

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags

permissions:
  contents: write         # create the GitHub release
  packages: write         # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python train.py
      - run: pytest -q

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build --build-arg APP_VERSION=${{ github.ref_name }} \
            -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest

      - name: GitHub release (model dump attached)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            model.joblib
            metrics.json

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_ACTOR,GH_TOKEN,GH_REPO
          script: |
            IMAGE=ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]'):latest
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker pull $IMAGE
            docker rm -f tiny-app || true
            docker run -d --name tiny-app --restart unless-stopped -p 80:8000 $IMAGE
            sleep 5 && curl -f http://localhost/health
